# Builds the macOS app (.dmg for Apple Silicon + Intel) on GitHub's free macOS runner.
# GitHub → Actions → "Build macOS app" → Run workflow. The .dmg files appear under "Artifacts".
name: Build macOS app

on:
  workflow_dispatch: {}

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build web app + macOS app
        env:
          # no paid Apple certificate: the app is ad-hoc signed (see README for the one-time "xattr" step)
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run app:mac

      - uses: actions/upload-artifact@v4
        with:
          name: Doinik-Life-macOS
          path: release/*.dmg
          if-no-files-found: error
